<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:500px; overflow:hidden; }
  body {
    font-family:'Inter',sans-serif;
    background:radial-gradient(ellipse at 75% 20%, #14283f 0%, #0A0F1C 62%);
    display:flex; align-items:center; padding:0 64px; position:relative;
  }
  /* glow accents */
  .glow { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; }
  .g1 { width:280px; height:280px; background:#14B8A6; top:-90px; right:120px; }
  .g2 { width:220px; height:220px; background:#7C4DFF; bottom:-90px; left:-40px; opacity:.35; }
  .left { position:relative; z-index:2; max-width:600px; }
  .brand { font-family:'Fredoka',sans-serif; font-weight:700; font-size:78px; color:#fff; line-height:1; letter-spacing:-1px; }
  .brand span { color:#17D9C4; }
  .tag { font-size:26px; font-weight:700; color:#C3CBDA; margin-top:14px; }
  .sub { margin-top:22px; display:flex; gap:10px; }
  .pill { background:rgba(23,217,196,.14); color:#17D9C4; border:1.5px solid rgba(23,217,196,.5); border-radius:999px; padding:8px 16px; font-weight:800; font-size:16px; }
  .pill.alt { background:rgba(124,77,255,.14); color:#b79bff; border-color:rgba(124,77,255,.5); }
  /* right visual: syllable chips card */
  .right { position:absolute; right:64px; top:50%; transform:translateY(-50%); z-index:2; text-align:center; }
  .pillicon { font-size:104px; filter:drop-shadow(0 12px 24px rgba(0,0,0,.5)); }
  .word { font-family:'Fredoka',sans-serif; font-weight:700; font-size:34px; color:#fff; margin-top:6px; }
  .chips { display:flex; gap:8px; justify-content:center; margin-top:14px; }
  .chip { background:#1A2540; color:#C3CBDA; border-radius:11px; padding:8px 13px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:19px; }
  .chip.stress { background:rgba(255,193,7,.18); color:#FFC93C; box-shadow:inset 0 0 0 2px #FFC93C; }
</style>
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="left">
    <div class="brand">Pharma<span>Voice</span></div>
    <div class="tag">Wirkstoffnamen richtig aussprechen.</div>
    <div class="sub">
      <span class="pill">300 Wirkstoffe</span>
      <span class="pill alt">🎤 Hören &amp; Sprechen</span>
      <span class="pill">DE · EN · PT</span>
    </div>
  </div>
  <div class="right">
    <div class="pillicon">💊</div>
    <div class="word">Metronidazol</div>
    <div class="chips">
      <span class="chip">Met</span><span class="chip">ro</span>
      <span class="chip stress">NI</span><span class="chip">da</span><span class="chip">zol</span>
    </div>
  </div>
</body>
</html>
